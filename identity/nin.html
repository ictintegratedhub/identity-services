<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIN Verification</title>
  <style>
    /* ========== EXISTING PAGE STYLES (kept clean) ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #d4af37;
      --text-dark: #5a4a3a;
      --text-muted: #a89888;
      --error: #e74c3c;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #faf6ef 0%, #f5f0e8 100%);
      min-height: 100vh;
      padding: 30px 20px;
    }
    .container { max-width: 780px; margin: 0 auto; }
    .back { color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; margin-bottom: 20px; font-size: 14px; }
    .back:hover { color: var(--text-dark); }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .card-header h1 { font-size: 26px; color: var(--text-dark); font-weight: 700; }
    .card-header p { color: var(--text-muted); margin-top: 4px; font-size: 14px; }
    .tabs { display: flex; gap: 4px; background: #f0ece6; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 10px 16px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: var(--text-muted); }
    .tab-btn.active { background: white; color: var(--text-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; color: var(--text-dark); margin-bottom: 5px; font-size: 13px; }
    .form-group .required { color: var(--error); }
    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 12px 16px; border: 2px solid #e8e0d8; border-radius: 10px; font-size: 15px; background: rgba(255,255,255,0.8);
    }
    .input-wrapper input:focus { border-color: var(--gold); outline: none; }
    .btn-primary {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #f5c518); color: white; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { display: none; padding: 12px 16px; background: #fdf2f2; border: 1px solid #f5c6c6; border-radius: 10px; color: var(--error); font-size: 14px; margin-top: 12px; }
    .error-msg.visible { display: block; }
    .loading-overlay { display: none; text-align: center; padding: 40px 20px; }
    .loading-overlay.visible { display: block; }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(212,175,55,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { display: none; margin-top: 28px; }
    .result.visible { display: block; }
    .actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
    .format-select {
      padding: 12px 16px; border: 2px solid #e8e0d8; border-radius: 10px; font-size: 14px; background: white; min-width: 220px;
    }
    .btn-download {
      padding: 12px 24px; background: linear-gradient(135deg, var(--gold), #f5c518); color: white; border: none; border-radius: 10px;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn-download:disabled { opacity: 0.6; cursor: not-allowed; }
    .privacy { margin-top: 16px; padding: 12px 16px; background: rgba(255,255,255,0.6); border-radius: 12px; text-align: center; color: var(--text-muted); font-size: 12px; }

    /* ========== PRINTABLE SLIP (hidden on screen, shown only for PDF) ========== */
    #printableArea {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 297mm; /* A4 landscape width */
      height: 210mm;
      background: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .slip-page {
      width: 297mm;
      height: 210mm;
      display: flex;
      padding: 8mm;
      gap: 5mm; /* ~0.5cm gap */
      box-sizing: border-box;
    }

    .slip-side {
      flex: 1;
      border: 1px solid #ccc;
      position: relative;
      overflow: hidden;
      background: white;
    }

    /* ===== PREMIUM STYLE (green abstract feel) ===== */
    .premium .slip-side.front {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 40%, #a5d6a7 100%);
    }
    .premium .slip-side.back {
      background: #f1f8e9;
    }
    .premium .header-bar {
      background: #1b5e20;
      color: white;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
    }
    .premium .coat {
      text-align: center;
      font-size: 22px;
      margin: 4px 0;
    }

    /* ===== NEW IMPROVED STYLE (clean white/black) ===== */
    .improved .slip-side {
      background: white;
    }
    .improved .header-bar {
      background: #111;
      color: white;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
    }

    .nin-title {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      margin: 4px 0 2px;
      letter-spacing: 0.5px;
    }
    .nin-subtitle {
      text-align: center;
      font-size: 9px;
      color: #444;
      margin-bottom: 6px;
    }
    .photo-box {
      width: 32mm;
      height: 38mm;
      border: 1.5px solid #333;
      margin: 0 auto 6px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .details {
      padding: 0 8px;
      font-size: 9.5px;
      line-height: 1.45;
    }
    .details .row {
      display: flex;
      margin-bottom: 2px;
    }
    .details .label {
      width: 38%;
      color: #555;
      font-weight: 600;
    }
    .details .value {
      width: 62%;
      font-weight: 700;
      color: #111;
    }
    .nin-number {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin: 8px 0 4px;
      padding: 4px;
      background: rgba(0,0,0,0.05);
    }
    .qr-placeholder {
      width: 22mm;
      height: 22mm;
      border: 1px dashed #999;
      margin: 6px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #777;
    }
    .disclaimer {
      padding: 10px;
      font-size: 8.5px;
      line-height: 1.4;
      color: #222;
    }
    .disclaimer h4 {
      text-align: center;
      font-size: 11px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .disclaimer p {
      margin-bottom: 5px;
      text-align: justify;
    }
    .verified-stamp {
      text-align: center;
      color: #1b5e20;
      font-weight: bold;
      font-size: 11px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/identity" class="back">← Back to Identity Services</a>

    <div class="card">
      <div class="card-header">
        <h1>NIN Verification</h1>
        <p>Verify National Identification Number using multiple search methods</p>
      </div>

      <!-- Tabs (same as before) -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="nin">🪪 By NIN</button>
        <button class="tab-btn" data-tab="phone">📞 By Phone</button>
        <button class="tab-btn" data-tab="demographic">👤 By Demographic</button>
      </div>

      <!-- Forms (same structure as your previous version) -->
      <div class="tab-content active" id="tab-nin">
        <form id="ninForm">
          <div class="form-group">
            <label>NIN Number <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="text" id="ninInput" placeholder="Enter 11-digit NIN" maxlength="11" autocomplete="off">
            </div>
          </div>
          <button type="submit" class="btn-primary" id="verifyNinBtn">🔍 Verify NIN</button>
        </form>
      </div>

      <div class="tab-content" id="tab-phone">
        <form id="phoneForm">
          <div class="form-group">
            <label>Phone Number <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="text" id="phoneInput" placeholder="Enter 11-digit phone number" maxlength="11">
            </div>
          </div>
          <button type="submit" class="btn-primary">📞 Search by Phone</button>
        </form>
      </div>

      <div class="tab-content" id="tab-demographic">
        <form id="demoForm">
          <div class="form-group">
            <label>First Name <span class="required">*</span></label>
            <input type="text" id="firstNameInput" placeholder="First name">
          </div>
          <div class="form-group">
            <label>Last Name <span class="required">*</span></label>
            <input type="text" id="lastNameInput" placeholder="Last name">
          </div>
          <div class="form-group">
            <label>Gender <span class="required">*</span></label>
            <select id="genderInput">
              <option value="">Select</option>
              <option value="m">Male</option>
              <option value="f">Female</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date of Birth (DD-MM-YYYY) <span class="required">*</span></label>
            <input type="text" id="dobInput" placeholder="DD-MM-YYYY" maxlength="10">
          </div>
          <button type="submit" class="btn-primary">👤 Search by Demographic</button>
        </form>
      </div>

      <div class="error-msg" id="errorMsg"><span id="errorText"></span></div>
      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>Verifying...</p>
      </div>

      <!-- RESULT + DOWNLOAD -->
      <div class="result" id="result">
        <div class="actions">
          <select id="formatSelect" class="format-select">
            <option value="premium">Premium ID (Green)</option>
            <option value="improved">New Improved Slip (Clean)</option>
          </select>
          <button class="btn-download" id="downloadBtn">📥 Download PDF</button>
        </div>
      </div>
    </div>

    <div class="privacy">🔒 All verification requests are encrypted. Authorized staff only.</div>
  </div>

  <!-- Hidden printable area -->
  <div id="printableArea"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    // ===== Tab switching + form handling (same logic as before) =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    let currentData = null;

    async function verifyNIN(mode, params) {
      document.getElementById('errorMsg').classList.remove('visible');
      document.getElementById('result').classList.remove('visible');
      document.getElementById('loading').classList.add('visible');

      try {
        const res = await fetch('/api/identity/nin/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ searchMode: mode, ...params })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          currentData = data.data;
          document.getElementById('result').classList.add('visible');
        } else {
          showError(data.error || 'Verification failed');
        }
      } catch (e) {
        showError('Network error');
      } finally {
        document.getElementById('loading').classList.remove('visible');
      }
    }

    document.getElementById('ninForm').addEventListener('submit', e => {
      e.preventDefault();
      const nin = document.getElementById('ninInput').value.trim();
      if (nin.length !== 11) return showError('Enter a valid 11-digit NIN');
      verifyNIN('nin', { nin });
    });

    document.getElementById('phoneForm').addEventListener('submit', e => {
      e.preventDefault();
      const phone = document.getElementById('phoneInput').value.trim();
      if (phone.length !== 11) return showError('Enter a valid 11-digit phone');
      verifyNIN('phone', { phone });
    });

    document.getElementById('demoForm').addEventListener('submit', e => {
      e.preventDefault();
      const firstname = document.getElementById('firstNameInput').value.trim();
      const lastname = document.getElementById('lastNameInput').value.trim();
      const gender = document.getElementById('genderInput').value;
      const dob = document.getElementById('dobInput').value.trim();
      if (!firstname || !lastname || !gender || !dob) return showError('Fill all fields');
      verifyNIN('demographic', { firstname, lastname, gender, dob });
    });

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('visible');
    }

    // ===== PDF GENERATION =====
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!currentData) return;

      const format = document.getElementById('formatSelect').value;
      const area = document.getElementById('printableArea');
      area.innerHTML = '';
      area.className = format; // premium or improved

      const d = currentData;
      const photo = d.photo || 'https://ui-avatars.com/api/?name=User&background=cccccc&color=333&size=200';

      area.innerHTML = `
        <div class="slip-page">
          <!-- FRONT -->
          <div class="slip-side front">
            <div class="header-bar">FEDERAL REPUBLIC OF NIGERIA</div>
            <div class="coat">🇳🇬</div>
            <div class="nin-title">DIGITAL NIN SLIP</div>
            <div class="nin-subtitle">National Identification Number</div>

            <div class="photo-box">
              <img src="${photo}" alt="Photo">
            </div>

            <div class="details">
              <div class="row"><span class="label">Surname</span><span class="value">${(d.lastName || '').toUpperCase()}</span></div>
              <div class="row"><span class="label">Given Names</span><span class="value">${(d.firstName || '')} ${(d.middleName || '')}</span></div>
              <div class="row"><span class="label">Date of Birth</span><span class="value">${d.dob || '—'}</span></div>
              <div class="row"><span class="label">Sex</span><span class="value">${d.gender || '—'}</span></div>
              <div class="row"><span class="label">Phone</span><span class="value">${d.phone || '—'}</span></div>
              <div class="row"><span class="label">State of Origin</span><span class="value">${d.stateOfOrigin || '—'}</span></div>
              <div class="row"><span class="label">LGA of Origin</span><span class="value">${d.lgaOfOrigin || '—'}</span></div>
            </div>

            <div class="nin-number">${d.nin || '—'}</div>
            <div class="qr-placeholder">QR CODE</div>
            <div class="verified-stamp">✓ VERIFIED</div>
          </div>

          <!-- BACK -->
          <div class="slip-side back">
            <div class="disclaimer">
              <h4>DISCLAIMER</h4>
              <p><strong>Trust, but verify</strong></p>
              <p>Kindly ensure each time this ID is presented, that you verify the credentials using a Government APPROVED verification resource. The details on the front of this NIN Slip must EXACTLY match the verification result.</p>
              <p><strong>CAUTION!</strong></p>
              <p>If this NIN was not issued to the person on the front of this document, please DO NOT attempt to scan, photocopy or replicate the personal data contained herein.</p>
              <p>You are only permitted to scan the barcode for the purpose of identity verification.</p>
              <p>The FEDERAL GOVERNMENT OF NIGERIA assumes no responsibility if you accept any variance in the scan result or do not scan the 2D barcode overleaf.</p>
              <br>
              <p style="text-align:center; font-size:8px; color:#666;">
                This is a computer-generated slip.<br>
                Verified on: ${new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })}
              </p>
            </div>
          </div>
        </div>
      `;

      const opt = {
        margin: 0,
        filename: `NIN_${d.nin || 'Slip'}_${format}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };

      html2pdf().set(opt).from(area).save();
    });
  </script>
</body>
</html>
