<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium NIN Slip | AIIH</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @page {
      size: A4 portrait;
      margin: 8mm;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 297mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 5mm 0;
    }

    /* Vertical stack - front on top, back below with 0.1cm gap */
    .card-stack {
      display: flex;
      flex-direction: column;
      gap: 1mm;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .card-canvas {
      position: relative;
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: #ffffff;
      flex-shrink: 0;
    }

    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 1;
    }

    .card-data-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 2;
    }

    /* ============================================================
       PREMIUM SLIP POSITIONS (1280x800 coordinates)
       - DO NOT MODIFY - These are correctly aligned
    ============================================================ */

    .premium-photo {
      position: absolute;
      top: 215px;
      left: 60px;
      width: 255px;
      height: 330px;
      object-fit: cover;
      border-radius: 8px;
    }

    .premium-qr {
      position: absolute;
      top: 215px;
      left: 980px;
      width: 205px;
      height: 205px;
      background: #ffffff;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .premium-qr canvas,
    .premium-qr img {
      width: 100% !important;
      height: 100% !important;
    }

    .p-val {
      position: absolute;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
    }

    .p-val-surname {
      top: 275px;
      left: 400px;
      font-size: 34px;
      color: #111;
    }

    .p-val-given-names {
      top: 385px;
      left: 400px;
      font-size: 34px;
      color: #111;
    }

    .p-val-dob {
      top: 500px;
      left: 400px;
      font-size: 30px;
      color: #111;
    }

    .p-val-sex {
      top: 500px;
      left: 720px;
      font-size: 30px;
      color: #111;
    }

    .p-val-issue-date {
      top: 500px;
      left: 950px;
      font-size: 28px;
      color: #111;
      white-space: nowrap;
    }

    .p-val-nin {
      top: 680px;
      left: 280px;
      width: 720px;
      text-align: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #007A41;
    }

    /* ============================================================
       PRINT & RESPONSIVE
    ============================================================ */

    @media print {
      body {
        background: #ffffff;
      }
      .page {
        padding: 0;
        margin: 0;
        width: 100%;
        min-height: 297mm;
      }
      .card-canvas {
        transform: none;
      }
      .card-stack {
        gap: 1mm;
      }
    }

    @media screen and (max-width: 900px) {
      .card-canvas {
        transform: scale(0.5);
        transform-origin: top center;
      }
      .card-stack {
        gap: 1mm;
      }
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="card-stack">

      <!-- ========================================================
           PREMIUM FRONT (Top)
      ======================================================== -->

      <div class="card-canvas">
        <img src="/assets/premium-front.png" class="card-bg" alt="Premium Front">
        <div class="card-data-overlay">
          <img id="photo" class="premium-photo" src="" alt="ID Holder Photo">
          <div id="qr" class="premium-qr"></div>
          <div class="p-val p-val-surname" id="surname">—</div>
          <div class="p-val p-val-given-names" id="givenNames">—</div>
          <div class="p-val p-val-dob" id="dob">—</div>
          <div class="p-val p-val-sex" id="gender">—</div>
          <div class="p-val p-val-issue-date" id="issueDate">—</div>
          <div class="p-val p-val-nin" id="nin">—</div>
        </div>
      </div>

      <!-- ========================================================
           PREMIUM BACK (Bottom) - 0.1cm gap
      ======================================================== -->

      <div class="card-canvas">
        <img src="/assets/premium-back.png" class="card-bg" alt="Premium Back">
        <div class="card-data-overlay"></div>
      </div>

    </div>
  </div>

  <script>
    /* ============================================================
       1. LOAD SLIP DATA FROM SESSIONSTORAGE
    ============================================================ */

    (function loadSlipData() {
      try {
        const stored = sessionStorage.getItem('slipData');
        if (stored) {
          window.slipData = JSON.parse(stored);
          console.log('✅ Premium Slip: Data loaded from sessionStorage');
        } else {
          console.warn('⚠️ No slip data found, using fallback data');
          window.slipData = {
            nin: "2709 551 8260",
            surname: "WILLIAMS",
            firstName: "SARAH",
            middleName: "ANNIKIR",
            gender: "F",
            dateOfBirth: "10-14-1983",
            photo: ""
          };
        }
      } catch (e) {
        console.error('Error loading slip data:', e);
        window.slipData = {
          nin: "2709 551 8260",
          surname: "WILLIAMS",
          firstName: "SARAH",
          middleName: "ANNIKIR",
          gender: "F",
          dateOfBirth: "10-14-1983",
          photo: ""
        };
      }
    })();


    /* ============================================================
       2. HELPERS
    ============================================================ */

    function formatNIN(nin) {
      if (!nin) return "";
      nin = nin.toString().replace(/\D/g, "");
      if (nin.length !== 11) return nin;
      return nin.replace(/(\d{4})(\d{3})(\d{4})/, "$1 $2 $3");
    }

    function getFullName(data) {
      if (data.fullName) return data.fullName;
      return [data.firstName, data.middleName, data.surname]
        .filter(Boolean)
        .join(' ')
        .trim() || 'Not Available';
    }


    /* ============================================================
       3. ISSUE DATE
    ============================================================ */

    const now = new Date();
    const MONTHS = [
      "JAN", "FEB", "MAR", "APR", "MAY", "JUN",
      "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"
    ];

    const issueDate =
      String(now.getDate()).padStart(2, "0") +
      " " +
      MONTHS[now.getMonth()] +
      " " +
      now.getFullYear();


    /* ============================================================
       4. POPULATE FIELDS
    ============================================================ */

    function populateFields() {
      const d = window.slipData || {};

      // Given Names = First Name + Middle Name
      const givenNames = [d.firstName, d.middleName].filter(Boolean).join(' ') || '—';

      document.getElementById('surname').textContent = d.surname || '—';
      document.getElementById('givenNames').textContent = givenNames;
      document.getElementById('dob').textContent = d.dateOfBirth || '—';
      document.getElementById('gender').textContent = d.gender || '—';
      document.getElementById('issueDate').textContent = issueDate;
      document.getElementById('nin').textContent = formatNIN(d.nin);

      // Photo
      const photo = document.getElementById('photo');
      const fullName = getFullName(d);
      if (d.photo && d.photo.trim() !== '') {
        photo.src = d.photo;
        photo.onerror = function() {
          this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(fullName) +
            '&background=d4af37&color=fff&size=300';
        };
      } else {
        photo.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(fullName) +
          '&background=d4af37&color=fff&size=300';
      }
    }


    /* ============================================================
       5. GENERATE QR CODE
    ============================================================ */

    function generateQRCode() {
      const qrContainer = document.getElementById('qr');
      if (!qrContainer) return;

      const d = window.slipData || {};

      const qrData = JSON.stringify({
        nin: d.nin || '',
        fullName: getFullName(d),
        dob: d.dateOfBirth || '',
        gender: d.gender || ''
      });

      qrContainer.innerHTML = '';

      if (typeof QRCode === 'undefined') {
        qrContainer.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:10px;color:#999;">QR</div>';
        return;
      }

      try {
        new QRCode(qrContainer, {
          text: qrData,
          width: 180,
          height: 180,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
        console.log('✅ Premium QR Code generated');
      } catch (e) {
        console.error('Error generating QR:', e);
        qrContainer.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:10px;color:#999;">QR Error</div>';
      }
    }


    /* ============================================================
       6. RENDER
    ============================================================ */

    function renderSlip() {
      populateFields();
      generateQRCode();
    }


    /* ============================================================
       7. PRINT
    ============================================================ */

    function printSlip() {
      window.print();
    }


    /* ============================================================
       8. PDF EXPORT - Scale 0.3
    ============================================================ */

    function exportPDF() {
      if (typeof html2pdf === 'undefined') {
        printSlip();
        return;
      }

      const element = document.querySelector('.page');
      const stack = document.querySelector('.card-stack');

      // Scale the stack so two cards + gap fit on A4
      // 1280px ≈ 338mm → two cards + 1mm gap ≈ 677mm → A4 usable ≈ 194mm → scale ≈ 0.286
      // Using 0.3 for slightly larger cards
      const scaleFactor = 0.3;
      stack.style.transform = `scale(${scaleFactor})`;
      stack.style.transformOrigin = 'top center';

      const options = {
        margin: [8, 8, 8, 8],
        filename: `Premium_NIN_Slip_${(window.slipData?.nin || 'NIN').replace(/\s+/g, '')}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          logging: false,
          backgroundColor: '#ffffff',
          scrollX: 0,
          scrollY: 0
        },
        jsPDF: {
          unit: 'mm',
          format: 'a4',
          orientation: 'portrait'
        },
        pagebreak: { mode: ['avoid-all'] }
      };

      html2pdf()
        .set(options)
        .from(element)
        .save()
        .then(() => {
          stack.style.transform = '';
          console.log('✅ Premium PDF exported successfully');
        })
        .catch(err => {
          stack.style.transform = '';
          console.error('PDF error:', err);
        });
    }


    /* ============================================================
       9. AUTO PDF GENERATION ON LOAD
    ============================================================ */

    (function autoGeneratePDF() {
      if (sessionStorage.getItem('autoGeneratePDF') === 'false') return;

      window.addEventListener('load', function() {
        Promise.all(
          [...document.images].map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise(resolve => {
              img.onload = resolve;
              img.onerror = resolve;
            });
          })
        ).then(function() {
          setTimeout(function() {
            if (typeof exportPDF === 'function') {
              console.log('📄 Auto-generating Premium PDF...');
              try {
                exportPDF();
                sessionStorage.setItem('autoGeneratePDF', 'false');
              } catch (e) {
                console.error('Error generating PDF:', e);
              }
            }
          }, 800);
        });
      });
    })();


    /* ============================================================
       10. PRELOAD IMAGES
    ============================================================ */

    ['/assets/premium-front.png', '/assets/premium-back.png'].forEach(function(src) {
      const img = new Image();
      img.src = src;
    });


    /* ============================================================
       11. RENDER ON LOAD
    ============================================================ */

    document.addEventListener('DOMContentLoaded', function() {
      renderSlip();
    });


    /* ============================================================
       12. PUBLIC API
    ============================================================ */

    window.exportPremiumPDF = exportPDF;
    window.printPremiumSlip = printSlip;
    window.renderSlip = renderSlip;
    window.exportPDF = exportPDF;

    console.log('✅ Premium Slip Ready');
  </script>

</body>
</html>
