<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Improved NIN Slip | AIIH</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @page { size: A4 portrait; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #ffffff; font-family: Arial, Helvetica, sans-serif; }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 10mm 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background: #ffffff;
    }

    .card-stack {
      display: flex;
      flex-direction: column;
      gap: 8mm;
      align-items: center;
    }

    .card-canvas {
      position: relative;
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: #ffffff;
      flex-shrink: 0;
    }

    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 1;
    }

    .card-data-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 2;
    }

    /* ============================================================
       IMPROVED SLIP POSITIONS - Values on SAME LINE as labels
    ============================================================ */

    .improved-photo {
      position: absolute;
      top: 210px;
      left: 55px;
      width: 240px;
      height: 310px;
      object-fit: cover;
      border-radius: 6px;
    }

    .improved-qr {
      position: absolute;
      top: 200px;
      left: 980px;
      width: 150px;
      height: 150px;
      background: #ffffff;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .improved-qr canvas,
    .improved-qr img {
      width: 100% !important;
      height: 100% !important;
    }

    .imp-val {
      position: absolute;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      color: #000;
    }

    .imp-val-surname {
      top: 248px;
      left: 520px;
      font-size: 34px;
    }

    .imp-val-given-names {
      top: 355px;
      left: 520px;
      font-size: 34px;
    }

    .imp-val-dob {
      top: 470px;
      left: 520px;
      font-size: 30px;
    }

    .imp-val-sex {
      top: 470px;
      left: 780px;
      font-size: 30px;
    }

    .imp-val-issue-date {
      top: 470px;
      left: 980px;
      font-size: 28px;
    }

    .imp-val-nin {
      top: 640px;
      left: 280px;
      width: 720px;
      text-align: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #000;
    }

    @media print {
      body { background: #ffffff; }
      .page { padding: 0; margin: 0; width: 210mm; min-height: 297mm; }
      .card-canvas { transform: none; }
    }

    @media screen and (max-width: 900px) {
      .card-canvas { transform: scale(0.5); transform-origin: top center; }
      .card-stack { gap: 4mm; }
    }
  </style>
</head>

<body>

<div class="page">
  <div class="card-stack">

    <div class="card-canvas">
      <img src="/assets/improved-front.png" class="card-bg" alt="Improved Slip Template">
      <div class="card-data-overlay">
        <img id="photo" class="improved-photo" src="" alt="ID Holder Photo">
        <div id="qr" class="improved-qr"></div>
        <div class="imp-val imp-val-surname" id="surname">—</div>
        <div class="imp-val imp-val-given-names" id="firstName">—</div>
        <div class="imp-val imp-val-dob" id="dob">—</div>
        <div class="imp-val imp-val-sex" id="gender">—</div>
        <div class="imp-val imp-val-issue-date" id="issueDate">—</div>
        <div class="imp-val imp-val-nin" id="nin">—</div>
      </div>
    </div>

    <div class="card-canvas">
      <img src="/assets/improved-back.png" class="card-bg" alt="Improved Slip Back">
      <div class="card-data-overlay"></div>
    </div>

  </div>
</div>

<script>
  (function loadSlipData() {
    try {
      const stored = sessionStorage.getItem('slipData');
      if (stored) {
        window.slipData = JSON.parse(stored);
        console.log('✅ Improved Slip: Data loaded');
      } else {
        console.warn('⚠️ No slip data found, using fallback');
        window.slipData = {
          nin: "2709 551 8260",
          surname: "WILLIAMS",
          firstName: "SARAH ANNIKIR",
          gender: "F",
          dateOfBirth: "10-14-1983",
          photo: ""
        };
      }
    } catch (e) { console.error('Error loading slip data:', e); }
  })();

  function formatNIN(nin) {
    if (!nin) return "";
    nin = nin.toString().replace(/\D/g, "");
    if (nin.length !== 11) return nin;
    return nin.replace(/(\d{4})(\d{3})(\d{4})/, "$1 $2 $3");
  }

  function getFullName(data) {
    if (data.fullName) return data.fullName;
    return [data.firstName, data.middleName, data.surname].filter(Boolean).join(' ').trim() || 'Not Available';
  }

  const now = new Date();
  const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const issueDate = String(now.getDate()).padStart(2,"0") + " " + MONTHS[now.getMonth()] + " " + now.getFullYear();

  function populateFields() {
    const d = window.slipData || {};
    document.getElementById('surname').textContent = d.surname || '—';
    document.getElementById('firstName').textContent = d.firstName || '—';
    document.getElementById('dob').textContent = d.dateOfBirth || '—';
    document.getElementById('gender').textContent = d.gender || '—';
    document.getElementById('issueDate').textContent = issueDate;
    document.getElementById('nin').textContent = formatNIN(d.nin);

    const photo = document.getElementById('photo');
    const fullName = getFullName(d);
    if (d.photo && d.photo.trim() !== '') {
      photo.src = d.photo;
      photo.onerror = function() { this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(fullName) + '&background=d4af37&color=fff&size=300'; };
    } else {
      photo.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(fullName) + '&background=d4af37&color=fff&size=300';
    }
  }

  function generateQRCode() {
    const qrContainer = document.getElementById('qr');
    if (!qrContainer) return;
    const d = window.slipData || {};
    const qrData = JSON.stringify({
      nin: d.nin || '',
      fullName: getFullName(d),
      dob: d.dateOfBirth || '',
      gender: d.gender || ''
    });
    qrContainer.innerHTML = '';
    if (typeof QRCode === 'undefined') {
      qrContainer.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:10px;color:#999;">QR</div>';
      return;
    }
    try {
      new QRCode(qrContainer, {
        text: qrData,
        width: 120,
        height: 120,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      console.log('✅ Improved QR Code generated');
    } catch (e) {
      console.error('Error generating QR:', e);
      qrContainer.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:10px;color:#999;">QR Error</div>';
    }
  }

  function renderSlip() { populateFields(); generateQRCode(); }
  function printSlip() { window.print(); }

  function exportPDF() {
    if (typeof html2pdf === 'undefined') { printSlip(); return; }
    const element = document.querySelector('.page');
    const canvases = document.querySelectorAll('.card-canvas');
    const options = {
      margin: [8, 8, 8, 8],
      filename: `Improved_NIN_Slip_${(window.slipData?.nin || 'NIN').replace(/\s+/g, '')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 1.5,
        useCORS: true,
        allowTaint: true,
        logging: false,
        backgroundColor: '#ffffff',
        scrollX: 0,
        scrollY: 0,
        windowWidth: document.documentElement.offsetWidth,
        windowHeight: document.documentElement.offsetHeight
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['.card-canvas'] }
    };
    canvases.forEach(c => { c.style.transform = 'scale(0.72)'; c.style.transformOrigin = 'top center'; });
    html2pdf().set(options).from(element).save()
      .then(() => { canvases.forEach(c => c.style.transform = ''); console.log('✅ Improved PDF exported'); })
      .catch(err => { canvases.forEach(c => c.style.transform = ''); console.error('PDF error:', err); });
  }

  (function autoGeneratePDF() {
    if (sessionStorage.getItem('autoGeneratePDF') === 'false') return;
    window.addEventListener('load', function() {
      Promise.all([...document.images].map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
      })).then(function() {
        setTimeout(function() {
          if (typeof exportPDF === 'function') {
            console.log('📄 Auto-generating Improved PDF...');
            try { exportPDF(); sessionStorage.setItem('autoGeneratePDF', 'false'); } catch (e) { console.error('Error:', e); }
          }
        }, 800);
      });
    });
  })();

  ['/assets/improved-front.png', '/assets/improved-back.png'].forEach(function(src) { new Image().src = src; });
  document.addEventListener('DOMContentLoaded', renderSlip);
  window.exportImprovedPDF = exportPDF;
  window.printImprovedSlip = printSlip;
  window.renderSlip = renderSlip;
  window.exportPDF = exportPDF;
  console.log('✅ Improved Slip Ready');
</script>

</body>
</html>
