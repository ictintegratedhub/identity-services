<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Improved NIN Slip</title>

<style>

/* ==========================================================
   PRINT
========================================================== */

@page{

    size:A4 portrait;

    margin:10mm;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;

}

body{

    background:#ececec;

    font-family:Arial,Helvetica,sans-serif;

}

/* ==========================================================
   PAGE
========================================================== */

.page{

    width:210mm;
    min-height:297mm;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:10mm;

}

/* ==========================================================
   CARD STACK
========================================================== */

.card-stack{

    display:flex;

    flex-direction:column;

    gap:5mm;

}

/* ==========================================================
   CARD
========================================================== */

.card{

    position:relative;

    width:85.6mm;
    height:54mm;

    overflow:hidden;

    border-radius:2mm;

    background:#fff;

    box-shadow:0 2px 8px rgba(0,0,0,.18);

}

/* ==========================================================
   BACKGROUND
========================================================== */

.card-bg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;

}

/* ==========================================================
   OVERLAY
========================================================== */

.overlay{

    position:absolute;

    inset:0;

    z-index:5;

}

/* ==========================================================
   PHOTO
========================================================== */

.photo{

    position:absolute;

    left:6.5mm;
    top:15mm;

    width:18mm;
    height:22mm;

    border:.4mm solid #444;

    object-fit:cover;

}

/* ==========================================================
   QR
========================================================== */

.qr{

    position:absolute;

    right:6mm;
    top:9mm;

    width:18mm;
    height:18mm;

    background:#fff;

    padding:1mm;

}

/* ==========================================================
   LABELS
========================================================== */

.field{

    position:absolute;

}

.label{

    font-size:1.5mm;

    color:#444;

    text-transform:uppercase;

    font-weight:bold;

}

.value{

    font-size:2.2mm;

    color:#000;

    font-weight:bold;

    text-transform:uppercase;

}

/* ==========================================================
   POSITIONS
========================================================== */

.surname{

    left:30mm;
    top:15mm;

}

.firstname{

    left:30mm;
    top:22mm;

}

.middlename{

    left:30mm;
    top:29mm;

}

.gender{

    left:30mm;
    top:36mm;

}

.dob{

    left:48mm;
    top:36mm;

}

.issue{

    right:6mm;
    top:31mm;

    text-align:right;

}

/* ==========================================================
   NIN
========================================================== */

.nin-title{

    position:absolute;

    width:100%;

    bottom:8mm;

    text-align:center;

    font-size:1.8mm;

    font-weight:bold;

}

.nin{

    position:absolute;

    width:100%;

    bottom:2.5mm;

    text-align:center;

    font-size:4.8mm;

    letter-spacing:1mm;

    font-weight:800;

    color:#000;

}

@media print{

.card{

box-shadow:none;

}

}

</style>

</head>

<body>

<div class="page">

<div class="card-stack">

<!-- =======================================================
     FRONT
======================================================= -->

<div class="card">

<img
class="card-bg"
src="assets/improved-front.png">

<div class="overlay">

<img
id="photo"
class="photo">

<img
id="qr"
class="qr">

<div class="field surname">

<div class="label">

Surname

</div>

<div
class="value"
id="surname">

</div>

</div>

<div class="field firstname">

<div class="label">

Given Names

</div>

<div
class="value"
id="firstName">

</div>

</div>

<div class="field middlename">

<div class="label">

Middle Name

</div>

<div
class="value"
id="middleName">

</div>

</div>

<div class="field gender">

<div class="label">

Gender

</div>

<div
class="value"
id="gender">

</div>

</div>

<div class="field dob">

<div class="label">

Date of Birth

</div>

<div
class="value"
id="dob">

</div>

</div>

<div class="field issue">

<div class="label">

Issue Date

</div>

<div
class="value"
id="issueDate">

</div>

</div>

<div class="nin-title">

National Identification Number (NIN)

</div>

<div
class="nin"
id="nin">

</div>

</div>

</div>

<!-- =======================================================
     IMPROVED BACK
======================================================= -->

<div class="card">

<img
class="card-bg"
src="assets/improved-back.png">

<div class="overlay">

<!--
Reserved for future dynamic content.

Examples:

Tracking ID
Verification URL
Serial Number
Support QR
Version Number

Currently the artwork is entirely contained
inside improved-back.png.
-->

</div>

</div>

</div>

</div>

<script>

/* ==========================================================
   DATA SOURCE

   The application should inject
   window.slipData before loading this page.

   Fallback data below is only for testing.
========================================================== */

const slipData = window.slipData || {

    nin: "1234 5678 901",

    surname: "ADEBAYO",

    firstName: "CHUKWUEMEKA",

    middleName: "IBRAHIM",

    gender: "M",

    dateOfBirth: "14 APR 1992",

    photo: "assets/sample-photo.jpg",

    qr: "assets/sample-qr.png"

};

/* ==========================================================
   ISSUE DATE

   Generated every time
   the slip is created.
========================================================== */

const today = new Date();

const months = [

"JAN","FEB","MAR","APR","MAY","JUN",

"JUL","AUG","SEP","OCT","NOV","DEC"

];

const issueDate =
String(today.getDate()).padStart(2,"0")
+
" "
+
months[today.getMonth()]
+
" "
+
today.getFullYear();

/* ==========================================================
   POPULATE FRONT
========================================================== */

document.getElementById("surname").textContent =
slipData.surname || "";

document.getElementById("firstName").textContent =
slipData.firstName || "";

document.getElementById("middleName").textContent =
slipData.middleName || "";

document.getElementById("gender").textContent =
slipData.gender || "";

document.getElementById("dob").textContent =
slipData.dateOfBirth || "";

document.getElementById("nin").textContent =
slipData.nin || "";

document.getElementById("issueDate").textContent =
issueDate;

document.getElementById("photo").src =
slipData.photo || "";

document.getElementById("qr").src =
slipData.qr || "";

/* ==========================================================
   IMAGE FALLBACKS
========================================================== */

document.getElementById("photo").onerror = function(){

    this.src = "assets/default-photo.png";

};

document.getElementById("qr").onerror = function(){

    this.style.display = "none";

};

/* ==========================================================
   OPTIONAL HELPERS
========================================================== */

function updateSlip(data){

    document.getElementById("surname").textContent =
        data.surname || "";

    document.getElementById("firstName").textContent =
        data.firstName || "";

    document.getElementById("middleName").textContent =
        data.middleName || "";

    document.getElementById("gender").textContent =
        data.gender || "";

    document.getElementById("dob").textContent =
        data.dateOfBirth || "";

    document.getElementById("nin").textContent =
        data.nin || "";

    document.getElementById("photo").src =
        data.photo || "";

    document.getElementById("qr").src =
        data.qr || "";

}

window.updateImprovedSlip = updateSlip;
