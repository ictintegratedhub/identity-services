<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Improved NIN Slip | AIIH</title>

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ============================================================
       PRINT SETTINGS
    ============================================================ */

    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      background: #ececec;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ============================================================
       PAGE
    ============================================================ */

    .page {
      width: 210mm;
      min-height: 297mm;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10mm;
    }

    /* ============================================================
       CARD CANVAS - 1280x800 (scaled to fit)
    ============================================================ */

    .card-canvas {
      position: relative;
      width: 1280px;
      height: 800px;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      overflow: hidden;
      transform: scale(0.8);
      transform-origin: top left;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }

    @media print {
      .card-canvas {
        transform: scale(1);
        border: none;
        border-radius: 0;
      }
    }

    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 1;
    }

    .card-data-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 2;
    }

    /* ============================================================
       IMPROVED SLIP POSITIONS (Improved.jpg)
    ============================================================ */

    .improved-photo {
      position: absolute;
      top: 210px;
      left: 80px;
      width: 280px;
      height: 350px;
      object-fit: cover;
      border-radius: 6px;
    }

    /* Values - NO LABELS (template has them) */
    .imp-val {
      position: absolute;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
    }

    .imp-val-surname {
      top: 265px;
      left: 420px;
      font-size: 30px;
      color: #000;
    }

    .imp-val-given-names {
      top: 375px;
      left: 420px;
      font-size: 30px;
      color: #000;
    }

    .imp-val-dob {
      top: 485px;
      left: 420px;
      font-size: 28px;
      color: #000;
    }

    .imp-val-issue-date {
      top: 485px;
      left: 880px;
      font-size: 28px;
      color: #000;
    }

    .imp-val-nin {
      top: 635px;
      left: 340px;
      width: 600px;
      text-align: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #000000;
    }

    /* ============================================================
       LOADING STATE
    ============================================================ */

    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .ready {
      opacity: 1;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */

    @media screen and (max-width: 900px) {
      .page {
        width: 100%;
        min-height: auto;
        padding: 20px;
      }

      .card-canvas {
        transform: scale(0.5);
        transform-origin: top left;
      }
    }

    @media print {
      body {
        background: #fff;
      }
      .card-canvas {
        transform: scale(1);
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .page {
        padding: 0;
      }
    }
  </style>
</head>

<body>

<!-- ============================================================
     PAGE
============================================================= -->

<div class="page">
  <div class="card-canvas">

    <img src="/assets/improved-front.png" class="card-bg" alt="Improved Slip Template">

    <div class="card-data-overlay">

      <img id="photo" class="improved-photo" src="" alt="ID Holder Photo">

      <!-- DYNAMIC VALUES ONLY - NO LABELS (template has them) -->
      <div class="imp-val imp-val-surname" id="surname">—</div>
      <div class="imp-val imp-val-given-names" id="firstName">—</div>
      <div class="imp-val imp-val-dob" id="dob">—</div>
      <div class="imp-val imp-val-issue-date" id="issueDate">—</div>
      <div class="imp-val imp-val-nin" id="nin">—</div>

    </div>

  </div>
</div>


<!-- ============================================================
   SCRIPTS
============================================================= -->

<script>

  /* ============================================================
     1. LOAD SLIP DATA FROM SESSIONSTORAGE
  ============================================================ */

  (function loadSlipData() {
    try {
      const stored = sessionStorage.getItem('slipData');
      if (stored) {
        window.slipData = JSON.parse(stored);
        console.log('✅ Improved Slip: Data loaded from sessionStorage');
      } else {
        console.warn('⚠️ No slip data found in sessionStorage, using fallback data');
        window.slipData = {
          nin: "2709 551 8260",
          surname: "WILLIAMS",
          firstName: "SARAH ANNIKIR",
          gender: "F",
          dateOfBirth: "10-14-1983",
          photo: ""
        };
      }
    } catch (e) {
      console.error('Error loading slip data:', e);
      window.slipData = {
        nin: "2709 551 8260",
        surname: "WILLIAMS",
        firstName: "SARAH ANNIKIR",
        gender: "F",
        dateOfBirth: "10-14-1983",
        photo: ""
      };
    }
  })();


  /* ============================================================
     2. HELPERS
  ============================================================ */

  function formatNIN(nin) {
    if (!nin) return "";
    nin = nin.toString().replace(/\D/g, "");
    if (nin.length !== 11) return nin;
    return nin.replace(/(\d{4})(\d{3})(\d{4})/, "$1 $2 $3");
  }

  function getFullName(data) {
    if (data.fullName) return data.fullName;
    return [data.firstName, data.middleName, data.surname]
      .filter(Boolean)
      .join(' ')
      .trim() || 'Not Available';
  }


  /* ============================================================
     3. ISSUE DATE
  ============================================================ */

  const now = new Date();
  const MONTHS = [
    "JAN", "FEB", "MAR", "APR", "MAY", "JUN",
    "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"
  ];

  const issueDate =
    String(now.getDate()).padStart(2, "0") +
    " " +
    MONTHS[now.getMonth()] +
    " " +
    now.getFullYear();


  /* ============================================================
     4. POPULATE FIELDS
  ============================================================ */

  function populateFields() {
    const d = window.slipData || {};

    document.getElementById('surname').textContent = d.surname || '—';
    document.getElementById('firstName').textContent = d.firstName || '—';
    document.getElementById('dob').textContent = d.dateOfBirth || '—';
    document.getElementById('issueDate').textContent = issueDate;
    document.getElementById('nin').textContent = formatNIN(d.nin);

    // Photo
    const photo = document.getElementById('photo');
    if (d.photo && d.photo.trim() !== '') {
      photo.src = d.photo;
      photo.onerror = function() {
        this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(getFullName(d)) + '&background=d4af37&color=fff&size=300';
      };
    } else {
      photo.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(getFullName(d)) + '&background=d4af37&color=fff&size=300';
    }
  }


  /* ============================================================
     5. RENDER
  ============================================================ */

  function renderSlip() {
    populateFields();
  }


  /* ============================================================
     6. PRINT FUNCTION
  ============================================================ */

  function printSlip() {
    window.print();
  }


  /* ============================================================
     7. PDF EXPORT
  ============================================================ */

  function exportPDF() {
    if (typeof html2pdf === 'undefined') {
      printSlip();
      return;
    }

    const element = document.querySelector('.page');

    const options = {
      margin: 0,
      filename: `Improved_NIN_Slip_${(window.slipData?.nin || 'NIN').replace(/\s+/g, '')}.pdf`,
      image: { type: 'jpeg', quality: 1 },
      html2canvas: {
        scale: 3,
        useCORS: true,
        allowTaint: true,
        logging: false,
        backgroundColor: '#ffffff',
        scrollX: 0,
        scrollY: 0
      },
      jsPDF: {
        unit: 'mm',
        format: 'a4',
        orientation: 'portrait'
      },
      pagebreak: { mode: ['avoid-all'] }
    };

    html2pdf().set(options).from(element).save()
      .then(() => console.log('✅ Improved PDF exported'))
      .catch(err => console.error('PDF error:', err));
  }


  /* ============================================================
     8. AUTO PDF GENERATION ON LOAD
  ============================================================ */

  (function autoGeneratePDF() {
    const shouldAutoGenerate = sessionStorage.getItem('autoGeneratePDF') !== 'false';

    if (!shouldAutoGenerate) {
      console.log('🔄 Auto-generate disabled');
      return;
    }

    window.addEventListener('load', function() {
      Promise.all(
        [...document.images].map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        })
      ).then(function() {
        setTimeout(function() {
          if (typeof exportPDF === 'function') {
            console.log('📄 Auto-generating Improved PDF...');
            try {
              exportPDF();
              sessionStorage.setItem('autoGeneratePDF', 'false');
            } catch (e) {
              console.error('Error generating PDF:', e);
            }
          }
        }, 800);
      });
    });
  })();


  /* ============================================================
     9. PRELOAD BACKGROUND IMAGE
  ============================================================ */

  new Image().src = '/assets/improved-front.png';


  /* ============================================================
     10. RENDER ON LOAD
  ============================================================ */

  document.addEventListener('DOMContentLoaded', function() {
    renderSlip();
  });


  /* ============================================================
     11. PUBLIC API
  ============================================================ */

  window.exportImprovedPDF = exportPDF;
  window.printImprovedSlip = printSlip;
  window.renderSlip = renderSlip;
  window.exportPDF = exportPDF;

  console.log('✅ Improved Slip Ready');

</script>

</body>
</html>
