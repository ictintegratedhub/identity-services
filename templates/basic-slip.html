<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Basic NIN Slip</title>

<link rel="stylesheet" href="css/slip-common.css">

<style>

.basic-card{

    position:relative;

    width:190mm;
    height:120mm;

    overflow:hidden;

    background:#fff;

}

.basic-bg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    z-index:1;

}

.overlay{

    position:absolute;

    inset:0;

    z-index:5;

    font-family:Arial,Helvetica,sans-serif;

}

/* Photo */

.photo{

    position:absolute;

    left:149.5mm;

    top:24.5mm;

    width:30mm;

    height:47mm;

    object-fit:cover;

}

/* Common Text */

.field{

    position:absolute;

    color:#000;

}

.label{

    display:none;

}

.value{

    font-size:3.2mm;

    font-weight:700;

    color:#111;

    text-transform:uppercase;

}

/* Left Column */

.tracking{

    left:2mm;

    top:30mm;

    width:47mm;

}

.nin{

    left:2mm;

    top:47mm;

    width:47mm;

}

/* Middle Column */

.surname{

    left:52mm;

    top:30mm;

    width:50mm;

}

.firstname{

    left:52mm;

    top:47mm;

    width:50mm;

}

.middlename{

    left:52mm;

    top:58.5mm;

    width:50mm;

}

.gender{

    left:52mm;

    top:70mm;

    width:50mm;

}

/* Address */

.address{

    left:104mm;

    top:30mm;

    width:42mm;

}

.address .value{

    font-size:2.8mm;

    line-height:1.35;

    text-transform:none;

}

/* Footer (optional) */

.footer{

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    display:none;

}

@media print{

    body{

        background:#fff;

    }

    .basic-card{

        box-shadow:none;

    }

}

</style>

</head>

<body>

<div class="page">

<div class="basic-card">

<img
src="assets/basic-slip.png"
class="basic-bg">

<div class="overlay">

<img
id="photo"
class="photo">

<div class="field tracking">

<div class="value"
id="trackingId">

</div>

</div>

<div class="field nin">

<div class="value"
id="nin">

</div>

</div>

<div class="field surname">

<div class="value"
id="surname">

</div>

</div>

<div class="field firstname">

<div class="value"
id="firstName">

</div>

</div>

<div class="field middlename">

<div class="value"
id="middleName">

</div>

</div>

<div class="field gender">

<div class="value"
id="gender">

</div>

</div>

<div class="field address">

<div class="value"
id="address">

</div>

</div>

</div>

</div>

</div>

<script>

const slipData = window.slipData || {

    trackingId: "R0A1B2C3D4",

    nin: "12345678901",

    surname: "ADEBAYO",

    firstName: "CHUKWUEMEKA",

    middleName: "IBRAHIM",

    gender: "MALE",

    address: "123 COMMERCIAL AVENUE, IKEJA, LAGOS STATE",

    photo: "assets/sample-photo.jpg"

};


/* Populate Fields */

document.getElementById("trackingId").textContent =
    slipData.trackingId || "";

document.getElementById("nin").textContent =
    formatNIN(slipData.nin);

document.getElementById("surname").textContent =
    slipData.surname || "";

document.getElementById("firstName").textContent =
    slipData.firstName || "";

document.getElementById("middleName").textContent =
    slipData.middleName || "";

document.getElementById("gender").textContent =
    slipData.gender || "";

document.getElementById("address").textContent =
    slipData.address || "";


/* Photo */

const photo = document.getElementById("photo");

photo.src = slipData.photo || "";

photo.onerror = function(){

    this.src = "assets/default-photo.png";

};


/* Format NIN */

function formatNIN(nin){

    if(!nin) return "";

    nin = nin.toString().replace(/\D/g,"");

    if(nin.length !== 11) return nin;

    return nin.replace(
        /(\d{4})(\d{3})(\d{4})/,
        "$1 $2 $3"
    );

}


/* Public Update */

function updateBasicSlip(data){

    document.getElementById("trackingId").textContent =
        data.trackingId || "";

    document.getElementById("nin").textContent =
        formatNIN(data.nin);

    document.getElementById("surname").textContent =
        data.surname || "";

    document.getElementById("firstName").textContent =
        data.firstName || "";

    document.getElementById("middleName").textContent =
        data.middleName || "";

    document.getElementById("gender").textContent =
        data.gender || "";

    document.getElementById("address").textContent =
        data.address || "";

    document.getElementById("photo").src =
        data.photo || "assets/default-photo.png";

}

window.updateBasicSlip = updateBasicSlip;

/* Print */

function printSlip(){

    window.print();

}


/* PDF Export */

function exportPDF(){

    if(typeof html2pdf === "undefined"){

        printSlip();

        return;

    }

    const element = document.querySelector(".page");

    html2pdf()

        .set({

            margin:0,

            filename:
            `Basic_NIN_Slip_${(slipData.nin || "NIN").replace(/\s+/g,"")}.pdf`,

            image:{

                type:"jpeg",

                quality:1

            },

            html2canvas:{

                scale:4,

                useCORS:true,

                allowTaint:true,

                backgroundColor:"#ffffff",

                scrollX:0,

                scrollY:0,

                logging:false

            },

            jsPDF:{

                unit:"mm",

                format:"a4",

                orientation:"portrait"

            },

            pagebreak:{

                mode:["avoid-all"]

            }

        })

        .from(element)

        .save();

}


/* Preload */

[
"assets/basic-slip.png",
"assets/default-photo.png"

].forEach(src=>{

    const img = new Image();

    img.src = src;

});


/* Wait for Images */

window.addEventListener("load",()=>{

    Promise.all(

        [...document.images].map(img=>{

            if(img.complete){

                return Promise.resolve();

            }

            return new Promise(resolve=>{

                img.onload = resolve;

                img.onerror = resolve;

            });

        })

    ).then(()=>{

        console.log("Basic Slip Ready");

    });

});


window.printBasicSlip = printSlip;

window.exportBasicPDF = exportPDF;

</script>

</body>

</html>
