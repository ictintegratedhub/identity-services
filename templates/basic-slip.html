<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic NIN Slip | AIIH</title>

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ============================================================
       PRINT SETTINGS
    ============================================================ */

    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      background: #ececec;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ============================================================
       PAGE
    ============================================================ */

    .page {
      width: 210mm;
      min-height: 297mm;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10mm;
    }

    /* ============================================================
       CARD CANVAS - 1280x800 (scaled to fit)
    ============================================================ */

    .card-canvas {
      position: relative;
      width: 1280px;
      height: 800px;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      overflow: hidden;
      transform: scale(0.8);
      transform-origin: top left;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }

    @media print {
      .card-canvas {
        transform: scale(1);
        border: none;
        border-radius: 0;
      }
    }

    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 1;
    }

    .card-data-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 2;
    }

    /* ============================================================
       BASIC SLIP POSITIONS (basic-slip.png)
    ============================================================ */

    .basic-photo {
      position: absolute;
      top: 130px;
      right: 95px;
      width: 200px;
      height: 240px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    /* Values based on the template layout */
    .b-val {
      position: absolute;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      color: #000000;
    }

    /* Left column: Tracking ID and NIN */
    .b-val-tracking {
      top: 215px;
      left: 105px;
      font-size: 22px;
      color: #222;
    }

    .b-val-nin {
      top: 315px;
      left: 105px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #000;
    }

    /* Middle column: Surname, First Name, Middle Name, Gender */
    .b-val-surname {
      top: 215px;
      left: 400px;
      font-size: 22px;
      color: #222;
    }

    .b-val-firstname {
      top: 315px;
      left: 400px;
      font-size: 22px;
      color: #222;
    }

    .b-val-middlename {
      top: 390px;
      left: 400px;
      font-size: 20px;
      color: #222;
    }

    .b-val-gender {
      top: 465px;
      left: 400px;
      font-size: 20px;
      color: #222;
    }

    /* Right column: Address */
    .b-val-address {
      top: 215px;
      left: 750px;
      width: 320px;
      font-size: 18px;
      font-weight: 600;
      text-transform: none;
      line-height: 1.3;
      color: #222;
    }

    /* ============================================================
       LOADING STATE
    ============================================================ */

    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .ready {
      opacity: 1;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */

    @media screen and (max-width: 900px) {
      .page {
        width: 100%;
        min-height: auto;
        padding: 20px;
      }

      .card-canvas {
        transform: scale(0.5);
        transform-origin: top left;
      }
    }

    @media print {
      body {
        background: #fff;
      }
      .card-canvas {
        transform: scale(1);
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .page {
        padding: 0;
      }
    }
  </style>
</head>

<body>

<!-- ============================================================
     PAGE
============================================================= -->

<div class="page">
  <div class="card-canvas">

    <img src="/assets/basic-slip.png" class="card-bg" alt="Basic Slip Template">

    <div class="card-data-overlay">

      <img id="photo" class="basic-photo" src="" alt="ID Holder Photo">

      <!-- DYNAMIC VALUES ONLY - NO LABELS (template has them) -->
      <div class="b-val b-val-tracking" id="trackingId">—</div>
      <div class="b-val b-val-nin" id="nin">—</div>
      <div class="b-val b-val-surname" id="surname">—</div>
      <div class="b-val b-val-firstname" id="firstName">—</div>
      <div class="b-val b-val-middlename" id="middleName">—</div>
      <div class="b-val b-val-gender" id="gender">—</div>
      <div class="b-val b-val-address" id="address">—</div>

    </div>

  </div>
</div>


<!-- ============================================================
   SCRIPTS
============================================================= -->

<script>

  /* ============================================================
     1. LOAD SLIP DATA FROM SESSIONSTORAGE
  ============================================================ */

  (function loadSlipData() {
    try {
      const stored = sessionStorage.getItem('slipData');
      if (stored) {
        window.slipData = JSON.parse(stored);
        console.log('✅ Basic Slip: Data loaded from sessionStorage');
      } else {
        console.warn('⚠️ No slip data found in sessionStorage, using fallback data');
        window.slipData = {
          nin: "1234 5678 901",
          surname: "ADEBAYO",
          firstName: "CHUKWUEMEKA",
          middleName: "IBRAHIM",
          gender: "MALE",
          address: "123 COMMERCIAL AVENUE, IKEJA, LAGOS STATE",
          photo: "",
          trackingId: "R0A1B2C3D4"
        };
      }
    } catch (e) {
      console.error('Error loading slip data:', e);
      window.slipData = {
        nin: "1234 5678 901",
        surname: "ADEBAYO",
        firstName: "CHUKWUEMEKA",
        middleName: "IBRAHIM",
        gender: "MALE",
        address: "123 COMMERCIAL AVENUE, IKEJA, LAGOS STATE",
        photo: "",
        trackingId: "R0A1B2C3D4"
      };
    }
  })();


  /* ============================================================
     2. HELPERS
  ============================================================ */

  function formatNIN(nin) {
    if (!nin) return "";
    nin = nin.toString().replace(/\D/g, "");
    if (nin.length !== 11) return nin;
    return nin.replace(/(\d{4})(\d{3})(\d{4})/, "$1 $2 $3");
  }

  function getFullName(data) {
    if (data.fullName) return data.fullName;
    return [data.firstName, data.middleName, data.surname]
      .filter(Boolean)
      .join(' ')
      .trim() || 'Not Available';
  }


  /* ============================================================
     3. POPULATE FIELDS
  ============================================================ */

  function populateFields() {
    const d = window.slipData || {};

    document.getElementById('trackingId').textContent = d.trackingId || '—';
    document.getElementById('nin').textContent = formatNIN(d.nin);
    document.getElementById('surname').textContent = d.surname || '—';
    document.getElementById('firstName').textContent = d.firstName || '—';
    document.getElementById('middleName').textContent = d.middleName || '—';
    document.getElementById('gender').textContent = d.gender || '—';
    document.getElementById('address').textContent = d.address || '—';

    // Photo
    const photo = document.getElementById('photo');
    if (d.photo && d.photo.trim() !== '') {
      photo.src = d.photo;
      photo.onerror = function() {
        this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(getFullName(d)) + '&background=cccccc&color=333333&size=200';
      };
    } else {
      photo.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(getFullName(d)) + '&background=cccccc&color=333333&size=200';
    }
  }


  /* ============================================================
     4. RENDER
  ============================================================ */

  function renderSlip() {
    populateFields();
  }


  /* ============================================================
     5. PRINT FUNCTION
  ============================================================ */

  function printSlip() {
    window.print();
  }


  /* ============================================================
     6. PDF EXPORT
  ============================================================ */

  function exportPDF() {
    if (typeof html2pdf === 'undefined') {
      console.warn('html2pdf not loaded, using print fallback');
      printSlip();
      return;
    }

    const element = document.querySelector('.page');

    const options = {
      margin: 0,
      filename: `Basic_NIN_Slip_${(window.slipData?.nin || 'NIN').replace(/\s+/g, '')}.pdf`,
      image: {
        type: 'jpeg',
        quality: 1
      },
      html2canvas: {
        scale: 3,
        useCORS: true,
        allowTaint: true,
        logging: false,
        backgroundColor: '#ffffff',
        scrollX: 0,
        scrollY: 0
      },
      jsPDF: {
        unit: 'mm',
        format: 'a4',
        orientation: 'portrait'
      },
      pagebreak: {
        mode: ['avoid-all']
      }
    };

    html2pdf()
      .set(options)
      .from(element)
      .save()
      .then(function() {
        console.log('✅ Basic PDF exported successfully');
      })
      .catch(function(error) {
        console.error('PDF export error:', error);
      });
  }


  /* ============================================================
     7. AUTO PDF GENERATION ON LOAD
  ============================================================ */

  (function autoGeneratePDF() {
    const shouldAutoGenerate = sessionStorage.getItem('autoGeneratePDF') !== 'false';

    if (!shouldAutoGenerate) {
      console.log('🔄 Auto-generate disabled, showing preview only');
      return;
    }

    window.addEventListener('load', function() {
      Promise.all(
        [...document.images].map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        })
      ).then(function() {
        setTimeout(function() {
          if (typeof exportPDF === 'function') {
            console.log('📄 Auto-generating Basic PDF...');
            try {
              exportPDF();
              sessionStorage.setItem('autoGeneratePDF', 'false');
            } catch (e) {
              console.error('Error generating PDF:', e);
            }
          }
        }, 800);
      });
    });
  })();


  /* ============================================================
     8. PRELOAD BACKGROUND IMAGE
  ============================================================ */

  new Image().src = '/assets/basic-slip.png';


  /* ============================================================
     9. RENDER ON LOAD
  ============================================================ */

  document.addEventListener('DOMContentLoaded', function() {
    renderSlip();
  });


  /* ============================================================
     10. PUBLIC API
  ============================================================ */

  window.exportBasicPDF = exportPDF;
  window.printBasicSlip = printSlip;
  window.renderSlip = renderSlip;
  window.exportPDF = exportPDF;

  console.log('✅ Basic Slip Ready');

</script>

</body>
</html>
