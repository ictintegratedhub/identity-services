<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic NIN Slip | AIIH</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @page { size: A4 portrait; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #ffffff; font-family: Arial, Helvetica, sans-serif; }

    .page {
      width: 210mm;
      height: 297mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .card-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-canvas {
      position: relative;
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: #ffffff;
      flex-shrink: 0;
    }

    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 1;
    }

    .card-data-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      z-index: 2;
    }

    /* ============================================================
       BASIC SLIP POSITIONS (Master Coordinate Map)
    ============================================================ */

    .basic-photo {
      position: absolute;
      top: 120px;
      left: 1085px;
      width: 170px;
      height: 245px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .b-val {
      position: absolute;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      color: #000000;
    }

    .b-val-tracking {
      top: 158px;
      left: 24px;
      width: 180px;
      font-size: 22px;
      color: #222;
    }

    .b-val-nin {
      top: 258px;
      left: 24px;
      width: 210px;
      font-size: 24px;
      font-weight: 900;
      color: #000;
    }

    .b-val-surname {
      top: 158px;
      left: 255px;
      width: 185px;
      font-size: 22px;
      color: #222;
    }

    .b-val-firstname {
      top: 258px;
      left: 255px;
      width: 185px;
      font-size: 22px;
      color: #222;
    }

    .b-val-middlename {
      top: 332px;
      left: 255px;
      width: 185px;
      font-size: 22px;
      color: #222;
    }

    .b-val-gender {
      top: 405px;
      left: 255px;
      width: 185px;
      font-size: 22px;
      color: #222;
    }

    .b-val-address {
      top: 160px;
      left: 455px;
      width: 195px;
      font-size: 18px;
      font-weight: 600;
      text-transform: none;
      line-height: 1.25;
      color: #222;
    }

    @media print {
      body { background: #ffffff; }
      .page { padding: 0; margin: 0; width: 210mm; height: 297mm; }
      .card-canvas { transform: none; }
    }

    @media screen and (max-width: 900px) {
      .card-canvas { transform: scale(0.5); transform-origin: top center; }
    }
  </style>
</head>

<body>

<div class="page">
  <div class="card-stack">
    <div class="card-canvas">
      <img src="/assets/basic-slip.png" class="card-bg" alt="Basic Slip Template">
      <div class="card-data-overlay">
        <img id="photo" class="basic-photo" src="" alt="ID Holder Photo">
        <div class="b-val b-val-tracking" id="trackingId">—</div>
        <div class="b-val b-val-nin" id="nin">—</div>
        <div class="b-val b-val-surname" id="surname">—</div>
        <div class="b-val b-val-firstname" id="firstName">—</div>
        <div class="b-val b-val-middlename" id="middleName">—</div>
        <div class="b-val b-val-gender" id="gender">—</div>
        <div class="b-val b-val-address" id="address">—</div>
      </div>
    </div>
  </div>
</div>

<script>
  (function loadSlipData() {
    try {
      const stored = sessionStorage.getItem('slipData');
      if (stored) {
        window.slipData = JSON.parse(stored);
        console.log('✅ Basic Slip: Data loaded');
      } else {
        console.warn('⚠️ No slip data found, using fallback');
        window.slipData = {
          nin: "1234 5678 901",
          surname: "ADEBAYO",
          firstName: "CHUKWUEMEKA",
          middleName: "IBRAHIM",
          gender: "MALE",
          address: "123 COMMERCIAL AVENUE, IKEJA, LAGOS STATE",
          photo: "",
          trackingId: "R0A1B2C3D4"
        };
      }
    } catch (e) {
      console.error('Error loading slip data:', e);
    }
  })();

  function formatNIN(nin) {
    if (!nin) return "";
    nin = nin.toString().replace(/\D/g, "");
    if (nin.length !== 11) return nin;
    return nin.replace(/(\d{4})(\d{3})(\d{4})/, "$1 $2 $3");
  }

  function getFullName(data) {
    if (data.fullName) return data.fullName;
    return [data.firstName, data.middleName, data.surname].filter(Boolean).join(' ').trim() || 'Not Available';
  }

  function populateFields() {
    const d = window.slipData || {};
    document.getElementById('trackingId').textContent = d.trackingId || '—';
    document.getElementById('nin').textContent = formatNIN(d.nin);
    document.getElementById('surname').textContent = d.surname || '—';
    document.getElementById('firstName').textContent = d.firstName || '—';
    document.getElementById('middleName').textContent = d.middleName || '—';
    document.getElementById('gender').textContent = d.gender || '—';
    document.getElementById('address').textContent = d.address || '—';

    const photo = document.getElementById('photo');
    const fullName = getFullName(d);
    if (d.photo && d.photo.trim() !== '') {
      photo.src = d.photo;
      photo.onerror = function() {
        this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(fullName) + '&background=cccccc&color=333333&size=200';
      };
    } else {
      photo.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(fullName) + '&background=cccccc&color=333333&size=200';
    }
  }

  function renderSlip() { populateFields(); }

  function printSlip() { window.print(); }

  function exportPDF() {
    if (typeof html2pdf === 'undefined') { printSlip(); return; }
    const element = document.querySelector('.page');
    const options = {
      margin: 0,
      filename: `Basic_NIN_Slip_${(window.slipData?.nin || 'NIN').replace(/\s+/g, '')}.pdf`,
      image: { type: 'jpeg', quality: 1 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false,
        backgroundColor: '#ffffff'
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all'] }
    };
    html2pdf().set(options).from(element).save()
      .then(() => console.log('✅ Basic PDF exported'))
      .catch(err => console.error('PDF error:', err));
  }

  (function autoGeneratePDF() {
    if (sessionStorage.getItem('autoGeneratePDF') === 'false') return;
    window.addEventListener('load', function() {
      Promise.all([...document.images].map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
      })).then(function() {
        setTimeout(function() {
          if (typeof exportPDF === 'function') {
            console.log('📄 Auto-generating Basic PDF...');
            try { exportPDF(); sessionStorage.setItem('autoGeneratePDF', 'false'); } catch (e) { console.error('Error:', e); }
          }
        }, 800);
      });
    });
  })();

  new Image().src = '/assets/basic-slip.png';
  document.addEventListener('DOMContentLoaded', renderSlip);
  window.exportBasicPDF = exportPDF;
  window.printBasicSlip = printSlip;
  window.renderSlip = renderSlip;
  window.exportPDF = exportPDF;
  console.log('✅ Basic Slip Ready');
</script>

</body>
</html>
